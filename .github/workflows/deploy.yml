name: Build & Deploy Static Site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily 06:00 UTC (08:00 Sofia time) cron in December to unlock scheduled Advent posts automatically
  schedule:
    - cron: '0 6 * 12 *'

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node 22 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies deterministically (Day 13 & Day 14 practice)
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild sharp

      - name: Typecheck & Build Static Site
        env:
          ENFORCE_PUBDATE_GATE: 'true'
        run: npm run build

      # Tip (Day 11): Migrate FIREBASE_SERVICE_ACCOUNT to GCP Workload Identity Federation (OIDC)
      # via google-github-actions/auth once your GCP Workload Identity Pool is configured.
      - name: Deploy to Firebase Hosting
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
